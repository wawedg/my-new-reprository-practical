<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusTime</title>
  <meta name="description" content="FocusTime – a Pomodoro timer with a simple task list for students.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/core/storage.js"></script>
  <script src="js/features/background.js"></script>
</head>
<body data-mode="focus">
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="FocusTime home">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="lg-frame" x="5" y="2.5" width="22" height="3.5" rx="1.75"/>
        <rect class="lg-frame" x="5" y="26" width="22" height="3.5" rx="1.75"/>
        <path class="lg-glass" d="M8.5 6h15v2c0 4.2-4.3 6.6-5.8 8 1.5 1.4 5.8 3.8 5.8 8v2h-15v-2c0-4.2 4.3-6.6 5.8-8-1.5-1.4-5.8-3.8-5.8-8z"/>
        <path class="lg-sand" d="M11.2 9.5h9.6c-.9 2.2-3.2 3.8-4.8 5.2-1.6-1.4-3.9-3-4.8-5.2z"/>
        <rect class="lg-sand lg-stream" x="15.35" y="14.5" width="1.3" height="6.5" rx=".65"/>
        <path class="lg-sand" d="M10.6 24.6c.6-2.6 3-4.1 5.4-4.6 2.4.5 4.8 2 5.4 4.6z"/>
      </svg>
      <span>FocusTime</span>
    </a>
    <nav aria-label="Main">
      <a href="index.html" aria-current="page">Timer</a>
      <a href="about.html">About Pomodoro</a>
    </nav>
  </header>

  <main class="app">
    <section id="timer-card" class="card timer-card" data-mode="focus" aria-labelledby="timer-heading">
      <h1 id="timer-heading" class="visually-hidden">Pomodoro timer</h1>

      <div class="mode-tabs" role="group" aria-label="Timer mode">
        <button type="button" class="mode-tab" data-mode="focus">Focus</button>
        <button type="button" class="mode-tab" data-mode="short">Short Break</button>
        <button type="button" class="mode-tab" data-mode="long">Long Break</button>
      </div>

      <p class="current-task">
        <span class="current-task-label">Working on</span>
        <strong id="current-task-name" class="is-empty">No task selected</strong>
      </p>

      <div id="time" class="time" role="timer">25:00</div>

      <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>

      <p id="cycle-info" class="cycle-info">Pomodoro 1 of 4</p>

      <div class="controls">
        <button type="button" id="start-btn" class="btn btn-primary btn-large">Start</button>
        <button type="button" id="reset-btn" class="btn btn-large">Reset</button>
      </div>
    </section>

    <section class="card tasks-card" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Tasks</h2>

      <form id="task-form" class="task-form" novalidate>
        <label for="task-input" class="visually-hidden">New task</label>
        <input id="task-input" type="text" maxlength="120" autocomplete="off"
               placeholder="What do you need to work on?">
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <p id="task-error" class="form-error" role="alert" hidden>Please enter a task title.</p>

      <h3 class="list-heading">Active <span id="active-count" class="pill">0</span></h3>
      <ul id="active-list" class="task-list"></ul>
      <p id="active-empty" class="empty">No active tasks. Add one above to get started.</p>

      <h3 class="list-heading">Completed <span id="completed-count" class="pill">0</span></h3>
      <ul id="completed-list" class="task-list"></ul>
      <p id="completed-empty" class="empty">Nothing completed yet.</p>
    </section>
  </main>

  <div id="status" class="visually-hidden" aria-live="polite"></div>

  <!-- Load order = dependency order: core → models → services → views → controller -->
  <script src="js/core/config.js"></script>
  <script src="js/models/timer.js"></script>
  <script src="js/models/task-store.js"></script>
  <script src="js/services/notifier.js"></script>
  <script src="js/ui/timer-view.js"></script>
  <script src="js/ui/task-view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
